version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps(actions)
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
